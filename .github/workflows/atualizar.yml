name: Atualizar notícias e publicar

on:
  schedule:
    # Horário de Cuiabá (UTC-4): 06h05, 11h05, 15h05 e 19h05
    - cron: "5 10,15,19,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install feedparser beautifulsoup4 requests

      - name: Coletar notícias
        run: python atualizar.py

      - name: Salvar notícias no repositório
        run: |
          git config user.name "Robô Diário Jurídico"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then
            echo "Sem novidades."
          else
            git commit -m "Atualização automática das notícias"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
